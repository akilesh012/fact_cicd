jobs:

  build-and-test:

    runs-on: ubuntu-latest
name: Java CI/CD

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        run: mvn clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: factorial-application
          path: target/*.jar


  deploy:

    needs: build-and-test

    runs-on: ubuntu-latest

    steps:

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: factorial-application
          path: app

      - name: Run application
        run: java -jar app/fact-cicd-1.0-SNAPSHOT.jar
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn test